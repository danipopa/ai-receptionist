apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: freeswitch-macvlan
  namespace: ai-receptionist
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp7s0",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.10.0.0/24",
        "rangeStart": "10.10.0.190",
        "rangeEnd": "10.0.0.200",
        "routes": [
          { "dst": "0.0.0.0/0" }
        ],
        "gateway": "10.10.0.1"
      }
    }
