apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vpp
  namespace: ai-receptionist
  labels:
    app: vpp
spec:
  selector:
    matchLabels:
      app: vpp
  template:
    metadata:
      labels:
        app: vpp
      annotations:
        k8s.v1.cni.cncf.io/networks: freeswitch-macvlan
    spec:
      containers:
        - name: vpp
          image: fdio/vpp:latest
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - mountPath: /dev/hugepages
              name: hugepages
            - mountPath: /etc/vpp/vpp.conf
              name: vpp-config
              subPath: vpp.conf
          # Optionally mount /dev/vfio for PCI access
          # devices:
          #   - devicePath: /dev/vfio
          #     name: vfio
      volumes:
        - name: hugepages
          hostPath:
            path: /dev/hugepages
            type: DirectoryOrCreate
        - name: vpp-config
          configMap:
            name: vpp-config
      restartPolicy: Always
